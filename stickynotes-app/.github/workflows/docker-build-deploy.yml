name: Stickynotes Docker Build Push Deploy

on:
  workflow_call:
    push:
      branches:
        - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: stickynotes-app-repo
  ECS_CLUSTER: app-cluster
  ECS_SERVICE: stickynotes-app-service

jobs:
  build-push-deploy:
    name: Stickynotes Build Push Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
          || aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Get ECR URI
        run: |
          ECR_URI=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "ECR_URI=$ECR_URI" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build \
            -t "$ECR_URI:${{ inputs.commit_sha }}" \
            -t "$ECR_URI:latest" \
            ./stickynotes-app

      - name: Push SHA Image
        run: |
          docker push "$ECR_URI:${{ inputs.commit_sha }}"

      - name: Push Latest Image
        run: |
          docker push "$ECR_URI:latest"

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for ECS Deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
