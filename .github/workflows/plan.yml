name: Terraform Plan

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

env:
  AWS_REGION: ap-south-1

jobs:
  plan-and-filter:
    name: Terraform Plan & Diff Detection
    runs-on: ubuntu-latest
    
    outputs:
      eticket_changed: ${{ steps.filter.outputs.eticket }}
      stickynotes_changed: ${{ steps.filter.outputs.stickynotes }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # -----------------------------------------------
      # Check folder diff changes
      # -----------------------------------------------
      - name: Path Filter Configuration
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: 'HEAD~1'
          filters: |
            eticket:
              - 'eticket-app/**'
            stickynotes:
              - 'stickynotes-app/**'

      # Save folder change status into a file for Apply workflow
      - name: Save changes status artifact
        run: |
          mkdir -p diff-status
          echo "${{ steps.filter.outputs.eticket }}" > diff-status/eticket.txt
          echo "${{ steps.filter.outputs.stickynotes }}" > diff-status/stickynotes.txt

      # -----------------------------------------------
      # AWS, Terraform Setup & Run Plan
      # -----------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Plan
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan

      # -----------------------------------------------
      # Upload exact tfplan and diff status
      # -----------------------------------------------
      - name: Upload Plan & Diff Status
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: |
            terraform/tfplan
            diff-status/
