name: Terraform Apply

on:
  workflow_run:
    workflows:
      - Terraform Plan
    types:
      - completed

permissions:
  contents: read
env:
  AWS_REGION: ap-south-1

jobs:
  check-plan:
    name: Verify Out File Status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      eticket_changed: ${{ steps.read-status.outputs.eticket }}
      stickynotes_changed: ${{ steps.read-status.outputs.stickynotes }}

    steps:
      - name: Get Plan Commit SHA
        id: commit
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Download Plan Artifact Pack
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ github.event.workflow_run.id }}
          PLAN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p diff-status
          gh run download "$PLAN_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "terraform-plan-${PLAN_SHA}"

      - name: Read Out Diff Data
        id: read-status
        run: |
          echo "eticket=$(cat diff-status/eticket.txt)" >> "$GITHUB_OUTPUT"
          echo "stickynotes=$(cat diff-status/stickynotes.txt)" >> "$GITHUB_OUTPUT"

  eticket:
    needs: check-plan
    if: ${{ needs.check-plan.outputs.eticket_changed == 'true' }}
    uses: ./.github/workflows/docker-build-deploy.yml
    with:
      commit_sha: ${{ needs.check-plan.outputs.commit_sha }}
    secrets: inherit

  stickynotes:
    needs: check-plan
    if: ${{ needs.check-plan.outputs.stickynotes_changed == 'true' }}
    uses: ./.github/workflows/docker-build-deploy.yml
    with:
      commit_sha: ${{ needs.check-plan.outputs.commit_sha }}
    secrets: inherit

  apply:
    name: Terraform Apply Via tfplan Out File
    runs-on: ubuntu-latest
    needs:
      - check-plan
      - eticket
      - stickynotes
    if: always() && (needs.check-plan.result == 'success') && (needs.eticket.result == 'success' || needs.eticket.result == 'skipped') && (needs.stickynotes.result == 'success' || needs.stickynotes.result == 'skipped')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-plan.outputs.commit_sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -input=false

      - name: Load Pre-generated tfplan Out File
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ github.event.workflow_run.id }}
          PLAN_SHA: ${{ needs.check-plan.outputs.commit_sha }}
        run: |
          mkdir -p terraform
          gh run download "$PLAN_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "terraform-plan-${PLAN_SHA}" \
            --dir terraform

      - name: Execute Terraform Apply via tfplan
        working-directory: terraform
        run: |
          terraform apply -input=false -auto-approve tfplan
